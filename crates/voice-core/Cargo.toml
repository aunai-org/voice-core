[package]
name = "voice-core"
description = "Offline pure-Rust measurement of pitch, loudness, pace, pauses and voice steadiness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
# Praat-derived reference numbers are test data only; keep them out of the published crate.
# (The workspace-root `tools/` directory is outside this package, so it is never packaged.)
exclude = ["tests/data/", "tests/oracle_reference.rs"]

[dependencies]
audioadapter-buffers = "2.0.0"
ebur128 = "0.1.10"
rubato = "1.0.1"

[dev-dependencies]
serde_json = "1"
